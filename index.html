$('downloadReport').onclick=()=>{const a=document.createElement('a'),url=URL.createObjectURL(new Blob([coachReport()],{type:'text/plain;charset=utf-8'}));a.href=url;a.download='hybrid-athlete-14-day-report.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('language').onclick=()=>{lang=lang==='en'?'ar':'en';render()};$('photoSave').onclick=()=>{if(!$('photoDate').value)return;data.photoDate=$('photoDate').value;save();renderProgress()};$('export').onclick=()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='hybrid-athlete-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('import').onchange=async e=>{try{let parsed=JSON.parse(await e.target.files[0].text());if(!Array.isArray(parsed.logs))throw Error();if(!confirm(t().confirm))return;data={logs:parsed.logs,cardioLogs:Array.isArray(parsed.cardioLogs)?parsed.cardioLogs:[],photoDate:parsed.photoDate||'',progressPhotos:Array.isArray(parsed.progressPhotos)?parsed.progressPhotos:[],whoopLogs:Array.isArray(parsed.whoopLogs)?parsed.whoopLogs:[]};save();render();alert(t().imported)}catch{alert(t().invalid)}};initStorage();
</script></body></html>
